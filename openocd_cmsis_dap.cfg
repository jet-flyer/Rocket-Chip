# OpenOCD config for Adafruit Debug Probe (CMSIS-DAP) with RP2350

# Use CMSIS-DAP adapter
adapter driver cmsis-dap
adapter speed 5000

# RP2350 target
source [find target/rp2350.cfg]

# rp2350.cfg defaults to SYSRESETREQ. That is MCU-only; STEMMA 3V3 stays up
# (Analog AN-686). cortex_m reset_config only accepts sysresetreq|vectreset
# on this OpenOCD — do not pass `none` there. Session `reset_config none`
# means no SRST; gdb-attach is halt-only. Flash is halt + write_image +
# vector resume, never `program` or `reset halt`.
reset_config none
if { [llength [target names]] > 0 } {
	foreach _t [target names] {
		$_t configure -event gdb-attach {
			echo "gdb-attach: halt only (no SYSRESETREQ)"
			halt
		}
	}
}
